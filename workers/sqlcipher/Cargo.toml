[package]
name = "werc-sqlcipher-worker"
version = "0.1.0"
edition = "2024"
publish = false

# 独立依赖图，禁止与产品 bundled SQLite 链接到同一进程。
[workspace]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "hooks", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
hex = "0.4"
md-5 = "0.10"
quick-xml = "=0.42.0"
ruzstd = "=0.8.3"

[profile.release]
strip = true

[build-dependencies]
static_vcruntime = "=3.0.0"
